<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docx to EPUB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>Docx to EPUB</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert">
              {% for msg in messages %}
                <p>{{ msg }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Título da Obra</label>
                <input type="text" id="title" name="title" placeholder="Ex: Dom Casmurro" required>
            </div>

            <div class="form-group">
                <label for="author">Autor</label>
                <input type="text" id="author" name="author" placeholder="Ex: Machado de Assis">
            </div>

            <div class="form-group">
                <label for="language">Idioma</label>
                <select id="language" name="language" required>
                    <option value="pt-BR" selected>Português (Brasil)</option>
                    <option value="pt-PT">Português (Portugal)</option>
                    <option value="en-US">Inglês (EUA)</option>
                    <option value="en-GB">Inglês (Reino Unido)</option>
                    <option value="es">Espanhol</option>
                    <option value="fr">Francês</option>
                </select>
            </div>

            <div class="form-group">
                <label for="doc_file">Documento Word (.docx)</label>
                <input type="file" id="doc_file" name="doc_file" accept=".docx" required>
            </div>

            <div class="form-group">
                <label for="cover_file">Imagem de Capa (Opcional - JPG/PNG)</label>
                <input type="file" id="cover_file" name="cover_file" accept=".jpg, .jpeg, .png">
            </div>

            <button type="submit">Gerar e Baixar EPUB</button>
        </form>
    </div>
</body>
</html>
